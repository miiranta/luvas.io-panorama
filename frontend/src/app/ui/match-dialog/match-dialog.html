<div class="backdrop" (click)="close.emit()"></div>

<section class="dialog" role="dialog" aria-label="Photo comparison">
    <div class="card-actions">
        <button type="button" class="round-action close" (click)="close.emit()" title="Close">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <path
                    d="M6.5 6.5l11 11M17.5 6.5l-11 11"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.8"
                    stroke-linecap="round"
                />
            </svg>
        </button>
    </div>
    @if (connection()) {
        <canvas #canvas></canvas>
        <span class="tag" [class.good]="verified()" [class.bad]="!verified()">
            {{ inliers() }} inliers · {{ ratio().toFixed(0) }}% of pairs ·
            {{ error().toFixed(1) }} px
        </span>
    } @else {
        <p class="empty">Take two photos to compare.</p>
    }
</section>
