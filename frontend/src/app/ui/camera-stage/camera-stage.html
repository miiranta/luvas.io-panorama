<video #video autoplay playsinline muted class="feed"></video>

@if (!active() && !switching()) {
    <button type="button" class="start" (click)="open()">
        <span class="lens"></span>
        Open camera
    </button>
}

<div class="hud">
    <span class="chip">
        <b>{{ frames() }}</b> photos
        @if (dropped() > 0) {
            <i>· {{ dropped() }} dropped</i>
        }
    </span>
    <span class="spacer"></span>
    <button type="button" class="icon" title="Metrics and graph" (click)="openInsights.emit()">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <circle cx="12" cy="12" r="9.2" fill="none" stroke="currentColor" stroke-width="2.4" />
            <circle cx="12" cy="7.6" r="1.5" fill="currentColor" />
            <path
                d="M12 11v6"
                fill="none"
                stroke="currentColor"
                stroke-width="2.4"
                stroke-linecap="round"
            />
        </svg>
    </button>
    <button type="button" class="icon" title="Parameters" (click)="openSettings.emit()">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path
                d="M12 3.4l1.5 2.2 2.6-.6.5 2.6 2.3 1.3-1.4 2.3 1.4 2.3-2.3 1.3-.5 2.6-2.6-.6L12 20.6l-1.5-2.2-2.6.6-.5-2.6-2.3-1.3 1.4-2.3-1.4-2.3 2.3-1.3.5-2.6 2.6.6z"
                fill="none"
                stroke="currentColor"
                stroke-width="2.2"
                stroke-linejoin="round"
            />
            <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2.2" />
        </svg>
    </button>
</div>

@if (cameraError() || pipelineError()) {
    <p class="toast">{{ cameraError() || pipelineError() }}</p>
}

<div class="dock">
    @if (canSwitch()) {
        <button type="button" class="icon flip" title="Switch camera" (click)="switchCamera()">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                <path
                    d="M4.2 9.6A8 8 0 0 1 18.6 7.4"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.4"
                    stroke-linecap="round"
                />
                <path
                    d="M19.8 14.4A8 8 0 0 1 5.4 16.6"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.4"
                    stroke-linecap="round"
                />
                <path
                    d="M18.4 3.4v4.2h-4.2M5.6 20.6v-4.2h4.2"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.4"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                />
            </svg>
        </button>
    }

    <button
        type="button"
        class="shutter"
        [class.busy]="busy()"
        [class.blocked]="!enoughOverlap()"
        [disabled]="!canShoot()"
        (click)="shoot()"
        [title]="enoughOverlap() ? 'Take photo' : 'Not enough overlap'"
    ></button>

    <div class="side-actions">
        <button
            type="button"
            class="icon compare"
            title="Compare with the previous photo"
            [disabled]="!canCompare()"
            (click)="openMatch.emit()"
        >
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                <rect
                    x="2.6"
                    y="5.4"
                    width="7.6"
                    height="13.2"
                    rx="1.8"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.2"
                />
                <rect
                    x="13.8"
                    y="5.4"
                    width="7.6"
                    height="13.2"
                    rx="1.8"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.2"
                />
                <path
                    d="M6.4 10.2L17.6 13.8"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.2"
                    stroke-linecap="round"
                />
            </svg>
        </button>
        <button
            type="button"
            class="icon reset"
            title="Reset panorama"
            [disabled]="!hasWork()"
            (click)="requestReset.emit()"
        >
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                <path
                    d="M19.5 12a7.5 7.5 0 1 1-2.6-5.7"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.4"
                    stroke-linecap="round"
                />
                <path
                    d="M18.4 2.8v4.2h-4.2"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.4"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                />
            </svg>
        </button>
    </div>
</div>
