@if (mosaic()) {
    <div class="minimap" (click)="toggle.emit()" [title]="expanded() ? 'Recolher' : 'Ampliar'">
        <canvas #canvas></canvas>

        <div class="card-actions">
            <button
                type="button"
                class="round-action save"
                [class.working]="saving()"
                [disabled]="saving()"
                (click)="save($event)"
                title="Exportar PNG"
            >
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                    <path
                        d="M12 3.6v10.2"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2.6"
                        stroke-linecap="round"
                    />
                    <path
                        d="M7.4 9.6L12 14.2l4.6-4.6"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2.6"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />
                    <path
                        d="M4.6 18.4h14.8"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2.6"
                        stroke-linecap="round"
                    />
                </svg>
            </button>
            @if (expanded()) {
                <button
                    type="button"
                    class="round-action close"
                    (click)="dismiss($event)"
                    title="Fechar"
                >
                    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                        <path
                            d="M6.5 6.5l11 11M17.5 6.5l-11 11"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2.8"
                            stroke-linecap="round"
                        />
                    </svg>
                </button>
            }
        </div>

        @if (expanded()) {
            <span class="meta">{{ size() }}</span>
        }
    </div>
}
