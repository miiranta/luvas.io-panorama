<canvas #canvas></canvas>

@if (overlay(); as info) {
    <span class="legend"> <i class="from"></i> no panorama <i class="to"></i> agora </span>
    <span class="pill" [class.weak]="!info.verified" [class.live]="info.live">
        <span class="verdict">
            {{ info.verified ? 'pode fotografar' : 'sobreposição insuficiente' }}
        </span>
        <b>{{ info.inliers }} pontos</b>
        @if (info.inliers > 0) {
            <i>{{ info.error.toFixed(1) }} px</i>
        }
        <i>vs {{ info.reference }}</i>
    </span>
}
